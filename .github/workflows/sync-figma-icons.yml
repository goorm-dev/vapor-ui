name: '[CI] Sync Icons'

on:
    workflow_dispatch:
    schedule:
        # Run every Thursday at 4 PM KST (07:00 UTC)
        - cron: '0 7 * * 4'

concurrency:
    # Fixed group, not keyed on github.ref: every run targets the same BRANCH_NAME
    # regardless of the ref it was dispatched from, so runs must serialize.
    group: ${{ github.workflow }}
    cancel-in-progress: false

env:
    BRANCH_NAME: sync-figma-icons

jobs:
    sync-figma-icons:
        runs-on: ubuntu-latest
        defaults:
            run:
                # The unspecified default is `bash -e`, which has no `pipefail`: a failing command
                # on the left of a pipe would be reported as success.
                shell: bash
        steps:
            - name: Checkout branch
              uses: actions/checkout@v4
              with:
                  # Sync from main whatever ref dispatched this run. The commit below is based on
                  # the checked-out ref, so a feature branch would drag its own diff into the
                  # pull request.
                  ref: main

            - name: Install
              uses: ./.github/composite/install

            - name: Sync Basic Icons
              env:
                  FIGMA_TOKEN: ${{ secrets.FIGMA_TOKEN }}
              run: pnpm --filter @repo/icon-extractor sync-icons:basic

            - name: Sync Symbol Icons
              env:
                  FIGMA_TOKEN: ${{ secrets.FIGMA_TOKEN }}
              run: pnpm --filter @repo/icon-extractor sync-icons:symbol

            # Reads what both syncs recorded and writes `.changeset/sync-icons-*.md` plus
            # `pr_body.md`. Untracked until the next step decides there is something to commit.
            - name: Write changeset and PR body
              run: pnpm --filter @repo/icon-extractor write-release-notes

            - name: Commit and open pull request
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  if [[ -z $(git status --porcelain packages/icons/src/) ]]; then
                      # No changes means main already matches Figma, so an open PR left over
                      # from an earlier run is stale and must not be merged.
                      STALE_PR=$(gh pr list --head "$BRANCH_NAME" --base main --state open --json number --jq '.[0].number // empty')
                      if [[ -n "$STALE_PR" ]]; then
                          gh pr close "$STALE_PR" --comment "Closing: main already matches Figma, so this sync is no longer valid."
                      fi
                      exit 0
                  fi

                  git config --local user.email "action@github.com"
                  git config --local user.name "GitHub Action"
                  git switch -C "$BRANCH_NAME"

                  git add packages/icons/src/ .changeset/
                  # `--no-verify`: the generated icons and the changeset are already
                  # prettier-formatted by the extractor, and the pull request gets linted by CI.
                  # The pre-commit hook would lint 18 packages this commit never touches, and it
                  # fails outright when the run is dispatched from a branch whose workspace layout
                  # differs from main.
                  git commit --no-verify -m "feat: sync icons from Figma

                  🤖 Generated with [GitHub Actions](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})

                  Co-Authored-By: GitHub Action <action@github.com>"
                  git push --force -u origin "$BRANCH_NAME"

                  # Reuse the open PR if there is one; only its body needs refreshing
                  EXISTING_PR=$(gh pr list --head "$BRANCH_NAME" --base main --state open --json number --jq '.[0].number // empty')
                  if [[ -n "$EXISTING_PR" ]]; then
                      gh pr edit "$EXISTING_PR" --body-file pr_body.md
                  else
                      gh pr create \
                          --title "feat: sync icons from Figma" \
                          --body-file pr_body.md \
                          --base main \
                          --head "$BRANCH_NAME"
                  fi

            - name: Notify Slack on Failure
              if: failure()
              run: |
                  WORKFLOW_STATUS=failure pnpm --filter @repo/icon-extractor notify:slack
              env:
                  SLACK_GDS_ALARM_WEBHOOK_URL: ${{ secrets.SLACK_GDS_ALARM_WEBHOOK_URL }}
                  GITHUB_REPOSITORY: ${{ github.repository }}
                  GITHUB_RUN_ID: ${{ github.run_id }}
                  GITHUB_RUN_NUMBER: ${{ github.run_number }}
                  GITHUB_REF_NAME: ${{ github.ref_name }}
