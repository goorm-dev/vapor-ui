name: '[CI] Sync Icons'

on:
    workflow_dispatch:
    schedule:
        # Run every Thursday at 4 PM KST (07:00 UTC)
        - cron: '0 7 * * 4'

concurrency:
    # Fixed group, not keyed on github.ref: every run targets the same BRANCH_NAME
    # regardless of the ref it was dispatched from, so runs must serialize.
    group: ${{ github.workflow }}
    cancel-in-progress: false

env:
    BRANCH_NAME: sync-figma-icons

jobs:
    sync-figma-icons:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout branch
              uses: actions/checkout@v4

            - name: Install
              uses: ./.github/composite/install

            - name: Sync Basic Icons
              id: sync_basic
              env:
                  FIGMA_TOKEN: ${{ secrets.FIGMA_TOKEN }}
              run: |
                  echo "🚀 Syncing basic icons"
                  pnpm --filter @repo/sync-figma sync-icons:basic | tee basic_sync_output.txt

                  # Extract sync results from output
                  NEW_BASIC=$(grep "FIGMA_SYNC_NEW_ICONS_BASIC=" basic_sync_output.txt | cut -d'=' -f2 || echo "")
                  UPDATED_BASIC=$(grep "FIGMA_SYNC_UPDATED_ICONS_BASIC=" basic_sync_output.txt | cut -d'=' -f2 || echo "")
                  DELETED_BASIC=$(grep "FIGMA_SYNC_DELETED_ICONS_BASIC=" basic_sync_output.txt | cut -d'=' -f2 || echo "")

                  echo "new_icons=$NEW_BASIC" >> $GITHUB_OUTPUT
                  echo "updated_icons=$UPDATED_BASIC" >> $GITHUB_OUTPUT
                  echo "deleted_icons=$DELETED_BASIC" >> $GITHUB_OUTPUT

            - name: Sync Symbol Icons
              id: sync_symbol
              env:
                  FIGMA_TOKEN: ${{ secrets.FIGMA_TOKEN }}
              run: |
                  echo "🚀 Syncing symbol icons"
                  pnpm --filter @repo/sync-figma sync-icons:symbol | tee symbol_sync_output.txt

                  # Extract sync results from output
                  NEW_SYMBOL=$(grep "FIGMA_SYNC_NEW_ICONS_SYMBOL=" symbol_sync_output.txt | cut -d'=' -f2 || echo "")
                  UPDATED_SYMBOL=$(grep "FIGMA_SYNC_UPDATED_ICONS_SYMBOL=" symbol_sync_output.txt | cut -d'=' -f2 || echo "")
                  DELETED_SYMBOL=$(grep "FIGMA_SYNC_DELETED_ICONS_SYMBOL=" symbol_sync_output.txt | cut -d'=' -f2 || echo "")

                  echo "new_icons=$NEW_SYMBOL" >> $GITHUB_OUTPUT
                  echo "updated_icons=$UPDATED_SYMBOL" >> $GITHUB_OUTPUT
                  echo "deleted_icons=$DELETED_SYMBOL" >> $GITHUB_OUTPUT

            - name: Create branch and commit changes
              run: |
                  # Check if there are changes in the icons directory
                  if [[ -n $(git status --porcelain packages/icons/src/) ]]; then
                      echo "has_changes=true" >> $GITHUB_ENV

                      git config --local user.email "action@github.com"
                      git config --local user.name "GitHub Action"

                      # Ensure we have the latest main branch
                      git fetch origin main
                      git checkout main
                      git pull origin main

                      # Reset the fixed branch onto the latest main, discarding whatever it held.
                      # Safe because the sync script rewrites every icon from Figma each run.
                      git switch -C "$BRANCH_NAME"

                      # Create changeset with details about updated icons
                      CHANGESET_FILE=".changeset/sync-icons-$(date +%Y%m%d%H%M%S).md"
                      
                      # Get icon lists for changeset
                      NEW_BASIC=$(grep "FIGMA_SYNC_NEW_ICONS_BASIC=" basic_sync_output.txt | cut -d'=' -f2 || echo "")
                      NEW_SYMBOL=$(grep "FIGMA_SYNC_NEW_ICONS_SYMBOL=" symbol_sync_output.txt | cut -d'=' -f2 || echo "")
                      UPDATED_BASIC=$(grep "FIGMA_SYNC_UPDATED_ICONS_BASIC=" basic_sync_output.txt | cut -d'=' -f2 || echo "")
                      UPDATED_SYMBOL=$(grep "FIGMA_SYNC_UPDATED_ICONS_SYMBOL=" symbol_sync_output.txt | cut -d'=' -f2 || echo "")
                      DELETED_BASIC=$(grep "FIGMA_SYNC_DELETED_ICONS_BASIC=" basic_sync_output.txt | cut -d'=' -f2 || echo "")
                      DELETED_SYMBOL=$(grep "FIGMA_SYNC_DELETED_ICONS_SYMBOL=" symbol_sync_output.txt | cut -d'=' -f2 || echo "")

                      # Determine if we have new icons (minor) or just updates (patch)
                      if [[ -n "$NEW_BASIC" || -n "$NEW_SYMBOL" ]]; then
                          # Minor version for new icons
                          echo "---" > "$CHANGESET_FILE"
                          echo "\"@vapor-ui/icons\": minor" >> "$CHANGESET_FILE"
                          echo "---" >> "$CHANGESET_FILE"
                          echo "" >> "$CHANGESET_FILE"
                          
                          # Create title with new icons list
                          echo "Add new icons from Figma" >> "$CHANGESET_FILE"
                          echo "" >> "$CHANGESET_FILE"
                          
                          if [[ -n "$NEW_BASIC" ]]; then
                              echo "**New Basic Icons:** \`$(echo $NEW_BASIC | sed 's/,/\`, \`/g')\`" >> "$CHANGESET_FILE"
                          fi
                          if [[ -n "$NEW_SYMBOL" ]]; then
                              echo "**New Symbol Icons:** \`$(echo $NEW_SYMBOL | sed 's/,/\`, \`/g')\`" >> "$CHANGESET_FILE"
                          fi
                          
                          # Add updated icons if any
                          if [[ -n "$UPDATED_BASIC" || -n "$UPDATED_SYMBOL" ]]; then
                              echo "" >> "$CHANGESET_FILE"
                              echo "**Also Updated:**" >> "$CHANGESET_FILE"
                              if [[ -n "$UPDATED_BASIC" ]]; then
                                  echo "- Basic Icons: \`$(echo $UPDATED_BASIC | sed 's/,/\`, \`/g')\`" >> "$CHANGESET_FILE"
                              fi
                              if [[ -n "$UPDATED_SYMBOL" ]]; then
                                  echo "- Symbol Icons: \`$(echo $UPDATED_SYMBOL | sed 's/,/\`, \`/g')\`" >> "$CHANGESET_FILE"
                              fi
                          fi

                          # Add deleted icons if any
                          if [[ -n "$DELETED_BASIC" || -n "$DELETED_SYMBOL" ]]; then
                              echo "" >> "$CHANGESET_FILE"
                              echo "**Removed:**" >> "$CHANGESET_FILE"
                              if [[ -n "$DELETED_BASIC" ]]; then
                                  echo "- Basic Icons: \`$(echo $DELETED_BASIC | sed 's/,/\`, \`/g')\`" >> "$CHANGESET_FILE"
                              fi
                              if [[ -n "$DELETED_SYMBOL" ]]; then
                                  echo "- Symbol Icons: \`$(echo $DELETED_SYMBOL | sed 's/,/\`, \`/g')\`" >> "$CHANGESET_FILE"
                              fi
                          fi
                      else
                          # Patch version for updated icons only
                          echo "---" > "$CHANGESET_FILE"
                          echo "\"@vapor-ui/icons\": patch" >> "$CHANGESET_FILE"
                          echo "---" >> "$CHANGESET_FILE"
                          echo "" >> "$CHANGESET_FILE"

                          # Create title with updated icons list
                          echo "Update icons from Figma" >> "$CHANGESET_FILE"
                          echo "" >> "$CHANGESET_FILE"

                          if [[ -n "$UPDATED_BASIC" ]]; then
                              echo "**Updated Basic Icons:** \`$(echo $UPDATED_BASIC | sed 's/,/\`, \`/g')\`" >> "$CHANGESET_FILE"
                          fi
                          if [[ -n "$UPDATED_SYMBOL" ]]; then
                              echo "**Updated Symbol Icons:** \`$(echo $UPDATED_SYMBOL | sed 's/,/\`, \`/g')\`" >> "$CHANGESET_FILE"
                          fi

                          # Add deleted icons if any
                          if [[ -n "$DELETED_BASIC" || -n "$DELETED_SYMBOL" ]]; then
                              echo "" >> "$CHANGESET_FILE"
                              echo "**Removed:**" >> "$CHANGESET_FILE"
                              if [[ -n "$DELETED_BASIC" ]]; then
                                  echo "- Basic Icons: \`$(echo $DELETED_BASIC | sed 's/,/\`, \`/g')\`" >> "$CHANGESET_FILE"
                              fi
                              if [[ -n "$DELETED_SYMBOL" ]]; then
                                  echo "- Symbol Icons: \`$(echo $DELETED_SYMBOL | sed 's/,/\`, \`/g')\`" >> "$CHANGESET_FILE"
                              fi
                          fi

                          # Fallback if no specific icons listed
                          if [[ -z "$UPDATED_BASIC" && -z "$UPDATED_SYMBOL" && -z "$DELETED_BASIC" && -z "$DELETED_SYMBOL" ]]; then
                              echo "Sync icons with the latest changes from Figma." >> "$CHANGESET_FILE"
                          fi
                      fi

                      # Add all changes including the changeset
                      git add packages/icons/src/ .changeset/
                      git commit -m "feat: sync icons from Figma

                      🤖 Generated with [GitHub Actions](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})

                      Co-Authored-By: GitHub Action <action@github.com>"
                      git push --force -u origin "$BRANCH_NAME"
                  fi

            - name: Create Pull Request
              id: create_pr
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  # Check if the branch was pushed (indicates changes were found)
                  if [[ "${has_changes:-}" == "true" ]]; then
                      # Prepare icon lists for PR body
                      NEW_BASIC_ICONS="${{ steps.sync_basic.outputs.new_icons }}"
                      NEW_SYMBOL_ICONS="${{ steps.sync_symbol.outputs.new_icons }}"
                      UPDATED_BASIC_ICONS="${{ steps.sync_basic.outputs.updated_icons }}"
                      UPDATED_SYMBOL_ICONS="${{ steps.sync_symbol.outputs.updated_icons }}"
                      DELETED_BASIC_ICONS="${{ steps.sync_basic.outputs.deleted_icons }}"
                      DELETED_SYMBOL_ICONS="${{ steps.sync_symbol.outputs.deleted_icons }}"

                      # Determine version bump type for PR body
                      if [[ -n "$NEW_BASIC_ICONS" || -n "$NEW_SYMBOL_ICONS" ]]; then
                          VERSION_BUMP="Minor"
                      else
                          VERSION_BUMP="Patch"
                      fi

                      # Create PR body
                      cat > pr_body.txt << EOF
                  ## 🤖 Automated Icon Sync from Figma

                  This PR syncs icons from Figma.

                  ### Sync Summary
                  | Category         | Details                          |
                  | ---------------- | -------------------------------- |
                  | **Version Bump** | $VERSION_BUMP |
                  | **Workflow Run** | [View Run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) |

                  ### Changes
                  EOF
                      if [[ -n "$NEW_BASIC_ICONS" ]]; then
                          echo "**New Basic Icons:** \`$(echo $NEW_BASIC_ICONS | sed 's/,/\`, \`/g')\`" >> pr_body.txt
                          echo "" >> pr_body.txt
                      fi
                      if [[ -n "$NEW_SYMBOL_ICONS" ]]; then
                          echo "**New Symbol Icons:** \`$(echo $NEW_SYMBOL_ICONS | sed 's/,/\`, \`/g')\`" >> pr_body.txt
                          echo "" >> pr_body.txt
                      fi
                      if [[ -n "$UPDATED_BASIC_ICONS" ]]; then
                          echo "**Updated Basic Icons:** \`$(echo $UPDATED_BASIC_ICONS | sed 's/,/\`, \`/g')\`" >> pr_body.txt
                          echo "" >> pr_body.txt
                      fi
                      if [[ -n "$UPDATED_SYMBOL_ICONS" ]]; then
                          echo "**Updated Symbol Icons:** \`$(echo $UPDATED_SYMBOL_ICONS | sed 's/,/\`, \`/g')\`" >> pr_body.txt
                          echo "" >> pr_body.txt
                      fi
                      if [[ -n "$DELETED_BASIC_ICONS" ]]; then
                          echo "**Removed Basic Icons:** \`$(echo $DELETED_BASIC_ICONS | sed 's/,/\`, \`/g')\`" >> pr_body.txt
                          echo "" >> pr_body.txt
                      fi
                      if [[ -n "$DELETED_SYMBOL_ICONS" ]]; then
                          echo "**Removed Symbol Icons:** \`$(echo $DELETED_SYMBOL_ICONS | sed 's/,/\`, \`/g')\`" >> pr_body.txt
                          echo "" >> pr_body.txt
                      fi

                      # Reuse the open PR if there is one; only its body needs refreshing
                      EXISTING_PR=$(gh pr list --head "$BRANCH_NAME" --base main --state open --json number --jq '.[0].number // empty')
                      if [[ -n "$EXISTING_PR" ]]; then
                          gh pr edit "$EXISTING_PR" --body-file pr_body.txt
                          PR_NUMBER="$EXISTING_PR"
                      else
                          PR_URL=$(gh pr create \
                          --title "feat: sync icons from Figma" \
                          --body-file pr_body.txt \
                          --base main \
                          --head "$BRANCH_NAME")
                          PR_NUMBER="${PR_URL##*/}"
                      fi
                      echo "number=$PR_NUMBER" >> $GITHUB_OUTPUT

                      # Clean up temporary file
                      rm -f pr_body.txt
                  else
                      # No changes means main already matches Figma, so an open PR left over
                      # from an earlier run is stale and must not be merged.
                      STALE_PR=$(gh pr list --head "$BRANCH_NAME" --base main --state open --json number --jq '.[0].number // empty')
                      # Only main can judge staleness — a dispatch from another branch compares against that branch.
                      if [[ -n "$STALE_PR" && "${{ github.ref_name }}" == "main" ]]; then
                          gh pr close "$STALE_PR" --comment "Closing: main already matches Figma, so this sync is no longer valid."
                      elif [[ -n "$STALE_PR" ]]; then
                          # Feature-branch dispatch: let the parity report land on the open sync PR.
                          echo "number=$STALE_PR" >> $GITHUB_OUTPUT
                      fi
                  fi

            # Visual check only — SVG-to-JSX conversion is covered offline by vitest.
            # compare.ts gates monochrome icons only: Figma's and Chromium's rasterizers antialias
            # colour icons differently enough to drown any real signal, so those are reported ungated.
            # Manual dispatch always runs it so the check itself can be exercised without a diff.
            - name: Check Icon Parity
              id: parity
              if: env.has_changes == 'true' || github.event_name == 'workflow_dispatch'
              continue-on-error: true
              env:
                  FIGMA_TOKEN: ${{ secrets.FIGMA_TOKEN }}
              run: |
                  pnpm --filter @vapor-ui/icons build
                  pnpm --filter @repo/sync-figma exec playwright install --with-deps chromium
                  pnpm --filter @repo/sync-figma parity:fetch --type=basic
                  pnpm --filter @repo/sync-figma parity:fetch --type=symbol
                  pnpm --filter @repo/sync-figma parity:render
                  # TEMPORARY: --gate-color fails colour icons too, only to exercise the report path.
                  pnpm --filter @repo/sync-figma parity:compare --gate-color

            # report.html inlines the Figma / code / diff PNGs of every failing icon, so the
            # artifact is one file that opens in a browser.
            - name: Upload Parity Report
              id: parity_report
              if: steps.parity.outcome == 'failure'
              uses: actions/upload-artifact@v4
              with:
                  name: icon-parity-report
                  path: scripts/sync-figma/parity/.cache/report.*
                  if-no-files-found: ignore

            - name: Comment Parity Failure on PR
              if: steps.parity.outcome == 'failure' && steps.create_pr.outputs.number != ''
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  REPORT=scripts/sync-figma/parity/.cache/report.md
                  {
                      echo "## ⚠️ 아이콘 시각 검증 실패"
                      echo ""
                      echo "동기화된 monochrome 아이콘이 Figma 렌더링과 다릅니다. 아이콘을 확인해 주세요."
                      echo ""
                      echo "🖼️ **[시각 diff 보기](${{ steps.parity_report.outputs.artifact-url }})** — 다운로드 후 \`report.html\`을 열면 실패한 아이콘마다 Figma / 코드 / diff 이미지가 나란히 보입니다."
                      echo ""
                      # GitHub caps a comment at 65536 chars; the report lists up to 60 rows.
                      [[ -f "$REPORT" ]] && head -c 60000 "$REPORT"
                      echo ""
                      echo "[워크플로 실행 보기](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})"
                  } > parity_comment.txt
                  gh pr comment "${{ steps.create_pr.outputs.number }}" --body-file parity_comment.txt

            - name: Fail if Icon Parity Failed
              if: steps.parity.outcome == 'failure'
              run: exit 1

            - name: Notify Slack on Failure
              if: failure()
              run: |
                  WORKFLOW_STATUS=failure pnpm --filter @repo/sync-figma notify:slack
              env:
                  SLACK_GDS_ALARM_WEBHOOK_URL: ${{ secrets.SLACK_GDS_ALARM_WEBHOOK_URL }}
                  GITHUB_REPOSITORY: ${{ github.repository }}
                  GITHUB_RUN_ID: ${{ github.run_id }}
                  GITHUB_RUN_NUMBER: ${{ github.run_number }}
                  GITHUB_REF_NAME: ${{ github.ref_name }}
