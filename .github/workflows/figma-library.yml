name: '[CI] Figma Library'

on:
    workflow_dispatch:
    schedule:
        # Every Monday at 00:00 UTC
        - cron: '0 0 * * 1'

permissions:
    contents: read

concurrency:
    group: ${{ github.workflow }}
    cancel-in-progress: false

jobs:
    figma-library:
        runs-on: ubuntu-latest
        defaults:
            run:
                shell: bash
        env:
            # The CLI reads FIGMA_ACCESS_TOKEN; the repo secret is named FIGMA_TOKEN.
            FIGMA_ACCESS_TOKEN: ${{ secrets.FIGMA_TOKEN }}
        steps:
            - name: Checkout branch
              uses: actions/checkout@v4
              with:
                  ref: main

            - name: Install
              uses: ./.github/composite/install

            - name: Build figma-blueprint
              run: pnpm --filter @vapor-ui/figma-blueprint build

            # Before the regeneration, so "entry no longer published" can still fire.
            - name: Check the library against entries
              id: library
              continue-on-error: true
              run: |
                  { echo '## Figma library check'; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
                  code=0
                  node packages/figma-blueprint/bin/figma-blueprint.mjs library --repo . 2>&1 | tee -a "$GITHUB_STEP_SUMMARY" || code=$?
                  echo '```' >> "$GITHUB_STEP_SUMMARY"
                  exit "$code"

            # Drift means Figma renamed or re-keyed a linked component. A person regenerates and opens a
            # normal PR, so CI and a changeset come with it; a bot PR pushed with GITHUB_TOKEN gets neither.
            - name: Regenerate entries and compare with main
              id: entries
              continue-on-error: true
              run: |
                  { echo '## Entries regeneration'; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
                  code=0
                  node packages/figma-blueprint/bin/figma-blueprint.mjs entries --repo . 2>&1 | tee -a "$GITHUB_STEP_SUMMARY" || code=$?
                  if [[ $code == 0 ]] && ! git diff --exit-code -- 'packages/*/figma-entries.json' >> "$GITHUB_STEP_SUMMARY"; then
                      echo "figma-entries.json is out of date: run 'pnpm --filter ./packages/figma-blueprint figma:entries' and open a PR." | tee -a "$GITHUB_STEP_SUMMARY"
                      code=1
                  fi
                  echo '```' >> "$GITHUB_STEP_SUMMARY"
                  exit "$code"

            - name: Fail the job if a check failed
              if: always()
              run: |
                  echo "library: ${{ steps.library.outcome }}, entries: ${{ steps.entries.outcome }}"
                  [[ "${{ steps.library.outcome }}" != failure && "${{ steps.entries.outcome }}" != failure ]]

    notify:
        name: Notify Slack
        needs: [figma-library]
        if: failure()
        runs-on: ubuntu-latest
        steps:
            - name: Checkout branch
              uses: actions/checkout@v4

            - name: Install
              uses: ./.github/composite/install

            - name: Notify Slack on Failure
              run: WORKFLOW_STATUS=failure pnpm --filter @repo/icon-extractor notify:slack
              env:
                  WORKFLOW_TITLE: Figma 라이브러리 검사 워크플로우
                  SLACK_GDS_ALARM_WEBHOOK_URL: ${{ secrets.SLACK_GDS_ALARM_WEBHOOK_URL }}
                  GITHUB_REPOSITORY: ${{ github.repository }}
                  GITHUB_RUN_ID: ${{ github.run_id }}
                  GITHUB_RUN_NUMBER: ${{ github.run_number }}
                  GITHUB_REF_NAME: ${{ github.ref_name }}
