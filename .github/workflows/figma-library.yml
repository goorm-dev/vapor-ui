name: '[CI] Figma Library'

on:
    workflow_dispatch:
    schedule:
        # Every Monday at 00:00 UTC
        - cron: '0 0 * * 1'

permissions:
    contents: write
    pull-requests: write

concurrency:
    group: ${{ github.workflow }}
    cancel-in-progress: false

env:
    BRANCH_NAME: sync-figma-entries

jobs:
    figma-library:
        runs-on: ubuntu-latest
        defaults:
            run:
                shell: bash
        env:
            # The CLI reads FIGMA_ACCESS_TOKEN; the repo secret is named FIGMA_TOKEN.
            FIGMA_ACCESS_TOKEN: ${{ secrets.FIGMA_TOKEN }}
        steps:
            - name: Checkout branch
              uses: actions/checkout@v4
              with:
                  ref: main

            - name: Install
              uses: ./.github/composite/install

            - name: Build figma-blueprint
              run: pnpm --filter @vapor-ui/figma-blueprint build

            - name: Regenerate entries
              run: node packages/figma-blueprint/bin/figma-blueprint.mjs entries --repo .

            - name: Open, update or close the entries pull request
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  EXISTING_PR=$(gh pr list --head "$BRANCH_NAME" --base main --state open --json number --jq '.[0].number // empty')

                  if [[ -z $(git status --porcelain packages/*/figma-entries.json) ]]; then
                      if [[ -n "$EXISTING_PR" ]]; then
                          gh pr close "$EXISTING_PR" --comment "Closing: main's figma-entries.json already matches Figma."
                      fi
                      exit 0
                  fi

                  git config --local user.email "action@github.com"
                  git config --local user.name "GitHub Action"
                  git switch -C "$BRANCH_NAME"
                  git add packages/*/figma-entries.json
                  git commit --no-verify -m "chore(core): regenerate figma-entries from Figma

                  🤖 Generated with [GitHub Actions](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})

                  Co-Authored-By: GitHub Action <action@github.com>"
                  git push --force -u origin "$BRANCH_NAME"

                  BODY="figma-entries.json drifted from the published Figma libraries. Regenerated by [this run](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})."
                  if [[ -n "$EXISTING_PR" ]]; then
                      gh pr edit "$EXISTING_PR" --body "$BODY"
                  else
                      gh pr create --title "chore(core): regenerate figma-entries from Figma" \
                          --body "$BODY" --base main --head "$BRANCH_NAME"
                  fi

            # Last, so a failure still fails the job after the pull request step ran.
            - name: Check the library against entries
              run: node packages/figma-blueprint/bin/figma-blueprint.mjs library --repo .
