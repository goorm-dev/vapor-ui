name: 'Code Quality Checks'

on:
    push:
        branches:
            - main
    pull_request:

env:
    TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
    TURBO_TEAM: ${{ vars.TURBO_TEAM }}

concurrency:
    group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
    cancel-in-progress: true

jobs:
    build:
        name: Build
        runs-on: ubuntu-latest
        steps:
            - name: Checkout branch
              uses: actions/checkout@v4

            - name: Install
              uses: ./.github/composite/install

            - name: Build packages
              run: pnpm build

    eslint:
        name: ESLint
        runs-on: ubuntu-latest
        steps:
            - name: Checkout branch
              uses: actions/checkout@v4

            - name: Install
              uses: ./.github/composite/install

            - name: Run ESLint
              run: pnpm lint

    types:
        name: TypeScript
        needs: build
        runs-on: ubuntu-latest
        steps:
            - name: Checkout branch
              uses: actions/checkout@v4

            - name: Install
              uses: ./.github/composite/install

            - name: Run typecheck
              run: pnpm typecheck

    prettier:
        name: Prettier
        runs-on: ubuntu-latest
        steps:
            - name: Checkout branch
              uses: actions/checkout@v4

            - name: Install
              uses: ./.github/composite/install

            - name: Run prettier
              run: pnpm format:check

    vitest:
        name: Vitest
        needs: build
        runs-on: ubuntu-latest
        steps:
            - name: Checkout branch
              uses: actions/checkout@v4

            - name: Install
              uses: ./.github/composite/install

            - name: Run Vitest
              run: pnpm test

    translations:
        name: Translations
        needs: build
        runs-on: ubuntu-latest
        steps:
            - name: Checkout branch
              uses: actions/checkout@v4

            - name: Install
              uses: ./.github/composite/install

            # 커밋된 경로에 그대로 덮어쓴다. 워킹트리가 "지금 소스에서 뽑은 산출물"이
            # 되므로 git이 곧 비교기가 된다 — 별도 비교 코드가 필요 없다.
            - name: Extract API docs
              run: pnpm api-docs:extract

            # LLM을 호출하지 않는다. 커밋된 사전을 적용만 하고, 사전에 없는 원문이
            # 있으면 여기서 멈춘다. 번역은 로컬에서 사람이 리뷰한 뒤 커밋된다.
            - name: Apply committed translations
              run: pnpm api-docs:translate --apply-only

            # git add를 거쳐야 신규 파일까지 잡힌다 — untracked는 git diff가 못 본다.
            - name: Detect drift
              id: drift
              run: |
                  git add -A apps/website/public/components/generated
                  if git diff --cached --quiet -- apps/website/public/components/generated; then
                      echo "산출물이 소스와 일치합니다."
                      exit 0
                  fi
                  {
                      echo '커밋된 API 문서가 현재 소스와 어긋납니다. 로컬에서 `pnpm api-docs`를 실행한 뒤 커밋하세요.'
                      echo
                      echo '```'
                      git diff --cached --stat -- apps/website/public/components/generated
                      echo '```'
                  } > "$RUNNER_TEMP/drift.md"
                  cat "$RUNNER_TEMP/drift.md"
                  exit 1

            - name: Verify dictionary
              run: pnpm api-docs:verify

            - name: Comment drift on PR
              if: failure() && steps.drift.outcome == 'failure' && github.event_name == 'pull_request'
              uses: actions/github-script@v7
              with:
                  script: |
                      const fs = require('fs');
                      const marker = '<!-- api-docs-drift -->';
                      const body = marker + '\n' + fs.readFileSync(process.env.RUNNER_TEMP + '/drift.md', 'utf8');
                      const { owner, repo } = context.repo;
                      const issue_number = context.issue.number;
                      const comments = await github.rest.issues.listComments({ owner, repo, issue_number });
                      const existing = comments.data.find((c) => c.body?.includes(marker));
                      if (existing) {
                          await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
                      } else {
                          await github.rest.issues.createComment({ owner, repo, issue_number, body });
                      }
