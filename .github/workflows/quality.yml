name: 'Code Quality Checks'

on:
    push:
        branches:
            - main
    pull_request:

env:
    TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
    TURBO_TEAM: ${{ vars.TURBO_TEAM }}

concurrency:
    group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
    cancel-in-progress: true

jobs:
    build:
        name: Build
        runs-on: ubuntu-latest
        steps:
            - name: Checkout branch
              uses: actions/checkout@v4

            - name: Install
              uses: ./.github/composite/install

            - name: Build packages
              run: pnpm build

    eslint:
        name: ESLint
        runs-on: ubuntu-latest
        steps:
            - name: Checkout branch
              uses: actions/checkout@v4

            - name: Install
              uses: ./.github/composite/install

            - name: Run ESLint
              run: pnpm lint

    types:
        name: TypeScript
        needs: build
        runs-on: ubuntu-latest
        steps:
            - name: Checkout branch
              uses: actions/checkout@v4

            - name: Install
              uses: ./.github/composite/install

            - name: Run typecheck
              run: pnpm typecheck

    prettier:
        name: Prettier
        runs-on: ubuntu-latest
        steps:
            - name: Checkout branch
              uses: actions/checkout@v4

            - name: Install
              uses: ./.github/composite/install

            - name: Run prettier
              run: pnpm format:check

    vitest:
        name: Vitest
        needs: build
        runs-on: ubuntu-latest
        steps:
            - name: Checkout branch
              uses: actions/checkout@v4

            - name: Install
              uses: ./.github/composite/install

            - name: Run Vitest
              run: pnpm test

    docs-api:
        name: Docs API
        runs-on: ubuntu-latest
        steps:
            - name: Checkout branch
              uses: actions/checkout@v4

            - name: Install
              uses: ./.github/composite/install

            # Run the extractor itself, not through turbo, so a cached result can't hide a change.
            - name: Regenerate API JSON
              run: pnpm --filter website docs:api

            - name: Check generated files are committed
              run: |
                  if [ -n "$(git status --porcelain -- apps/website/content)" ]; then
                      git status --short -- apps/website/content
                      git diff -- apps/website/content
                      echo "::error::Generated API JSON is out of date. Run \`pnpm docs:api\` locally and commit the result."
                      exit 1
                  fi
