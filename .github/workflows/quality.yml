name: 'Code Quality Checks'

on:
    push:
        branches:
            - main
    pull_request:

env:
    TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
    TURBO_TEAM: ${{ vars.TURBO_TEAM }}

concurrency:
    group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
    cancel-in-progress: true

jobs:
    build:
        name: Build
        runs-on: ubuntu-latest
        steps:
            - name: Checkout branch
              uses: actions/checkout@v4

            - name: Install
              uses: ./.github/composite/install

            - name: Build packages
              run: pnpm build

    eslint:
        name: ESLint
        runs-on: ubuntu-latest
        steps:
            - name: Checkout branch
              uses: actions/checkout@v4

            - name: Install
              uses: ./.github/composite/install

            - name: Run ESLint
              run: pnpm lint

    types:
        name: TypeScript
        needs: build
        runs-on: ubuntu-latest
        steps:
            - name: Checkout branch
              uses: actions/checkout@v4

            - name: Install
              uses: ./.github/composite/install

            - name: Run typecheck
              run: pnpm typecheck

    prettier:
        name: Prettier
        runs-on: ubuntu-latest
        steps:
            - name: Checkout branch
              uses: actions/checkout@v4

            - name: Install
              uses: ./.github/composite/install

            - name: Run prettier
              run: pnpm format:check

    vitest:
        name: Vitest
        needs: build
        runs-on: ubuntu-latest
        steps:
            - name: Checkout branch
              uses: actions/checkout@v4

            - name: Install
              uses: ./.github/composite/install

            - name: Run Vitest
              run: pnpm test

    translations:
        name: Translations
        needs: build
        runs-on: ubuntu-latest
        steps:
            - name: Checkout branch
              uses: actions/checkout@v4

            - name: Install
              uses: ./.github/composite/install

            # 영어 원문만 뽑는다. 번역은 로컬에서 하고 캐시를 커밋하므로 CI는 LLM을 호출하지 않는다.
            - name: Extract API docs (English)
              run: |
                  echo "export default { outputDir: '${{ runner.temp }}/api-en' };" > "${{ runner.temp }}/extract.config.mjs"
                  pnpm api-docs:extract --config "${{ runner.temp }}/extract.config.mjs"

            - name: Verify translations are up to date
              run: node scripts/translate-api-docs/verify.mjs "${{ runner.temp }}/api-en" scripts/translate-api-docs/translations.ko.json
