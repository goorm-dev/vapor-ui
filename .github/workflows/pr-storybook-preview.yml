name: 'PR Storybook Preview'

on:
    pull_request:
        types:
            - opened
            - synchronize
        paths:
            - packages/core/src/**
            - packages/composites/src/**
            - apps/storybook/**

permissions:
    id-token: write
    contents: read
    pull-requests: write

env:
    BUCKET_NAME: ${{ secrets.BUCKET_NAME }}
    AWS_REGION: ${{ secrets.AWS_REGION }}
    AWS_IAM_ROLE_NAME: ${{ secrets.AWS_IAM_ROLE_NAME }}
    AWS_IAM_ROLE_SESSION_NAME: ${{ secrets.AWS_IAM_ROLE_SESSION_NAME }}
    PREVIEW_PATH: pr-${{ github.event.pull_request.number }}
    TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
    TURBO_TEAM: ${{ vars.TURBO_TEAM }}

concurrency:
    group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
    cancel-in-progress: true

jobs:
    deploy-preview:
        if: github.event.pull_request.head.repo.full_name == github.repository
        runs-on: ubuntu-latest
        steps:
            - name: Git clone the repository
              uses: actions/checkout@v4

            - name: Install Dependencies
              uses: ./.github/composite/install

            - name: Build Storybook with base path
              env:
                  STORYBOOK_BASE_PATH: /${{ env.PREVIEW_PATH }}/
              run: pnpm build:storybook

            - name: Rewrite asset paths for subpath hosting
              run: |
                  cd apps/storybook/storybook-static
                  PREFIX="/${{ env.PREVIEW_PATH }}"
                  find . -type f \( -name '*.html' -o -name '*.js' -o -name '*.css' -o -name '*.json' \) \
                    -exec sed -i \
                      -e "s|=\"/assets/|=\"${PREFIX}/assets/|g" \
                      -e "s|=\"/sb-|=\"${PREFIX}/sb-|g" \
                      -e "s|'/assets/|'${PREFIX}/assets/|g" \
                      -e "s|'/sb-|'${PREFIX}/sb-|g" \
                      -e "s|\"/assets/|\"${PREFIX}/assets/|g" \
                      -e "s|\"/sb-|\"${PREFIX}/sb-|g" \
                      {} +

            - name: Configure AWS Credentials
              uses: aws-actions/configure-aws-credentials@v4
              with:
                  role-to-assume: ${{ env.AWS_IAM_ROLE_NAME }}
                  role-session-name: ${{ env.AWS_IAM_ROLE_SESSION_NAME }}
                  aws-region: ${{ env.AWS_REGION }}

            - name: Upload Storybook to S3
              run: |
                  aws s3 rm s3://${{ env.BUCKET_NAME }}/${{ env.PREVIEW_PATH }} --recursive
                  aws s3 cp './apps/storybook/storybook-static/' s3://${{ env.BUCKET_NAME }}/${{ env.PREVIEW_PATH }} \
                    --recursive \
                    --cache-control "public, max-age=31536000, immutable" \
                    --exclude "*.html" \
                    --exclude "*.json"
                  aws s3 cp './apps/storybook/storybook-static/' s3://${{ env.BUCKET_NAME }}/${{ env.PREVIEW_PATH }} \
                    --recursive \
                    --cache-control "no-cache, must-revalidate" \
                    --exclude "*" \
                    --include "*.html" \
                    --include "*.json"

            - name: Resolve commit SHA
              id: sha
              run: |
                  SHA_FULL="${{ github.event.pull_request.head.sha }}"
                  echo "full=$SHA_FULL" >> $GITHUB_OUTPUT
                  echo "short=${SHA_FULL:0:7}" >> $GITHUB_OUTPUT

            - name: Post preview comment
              uses: marocchino/sticky-pull-request-comment@v2
              with:
                  header: storybook-preview
                  GITHUB_TOKEN: ${{ secrets.VAPOR_BOT_TOKEN }}
                  message: |
                      📚 **Storybook Preview**

                      | Commit | Preview |
                      | :----- | :------ |
                      | [`${{ steps.sha.outputs.short }}`](https://github.com/${{ github.repository }}/commit/${{ steps.sha.outputs.full }}) | [Open Storybook ↗︎](http://${{ env.BUCKET_NAME }}/${{ env.PREVIEW_PATH }}/index.html) |
