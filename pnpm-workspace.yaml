packages:
    - apps/*
    - packages/*
    - scripts/docs-extractor
    - scripts/docs-translator
    - scripts/icon-extractor
    - scripts/extract-composites

engineStrict: true

# Every entry ships prebuilt binaries via optionalDependencies, so no install script needs to run.
# Keep the entries as false: strictDepBuilds fails install on any unlisted build script.
allowBuilds:
    '@parcel/watcher': false
    esbuild: false
    sharp: false
    unrs-resolver: false
    workerd: false

trustPolicy: no-downgrade
# Maintenance releases of older majors published without provenance after a newer major adopted it.
# Pinned to exact versions so any other version of these packages is still checked.
trustPolicyExclude:
    - '@storybook/addon-docs@9.1.21'
    - '@storybook/builder-vite@9.1.21'
    - '@storybook/csf-plugin@9.1.21'
    - '@storybook/react-dom-shim@9.1.21'
    - '@storybook/react-vite@9.1.21'
    - '@storybook/react@9.1.21'
    - chokidar@4.0.3
    - eslint-import-resolver-typescript@3.10.1
    - eslint-plugin-storybook@9.1.21
    - semver@5.7.2
    - semver@6.3.1
    - storybook@9.1.21
    - undici-types@6.21.0

# 3 days, matching the Renovate patch policy. Add urgent security patches to minimumReleaseAgeExclude.
minimumReleaseAge: 4320

# Unified React 19 for entire monorepo
# Libraries (packages/*) maintain peerDependencies for React 17/18/19 compatibility
catalog:
    react: ^19.3.1
    react-dom: ^19.3.1
    '@types/react': ^19.3.0
    '@types/react-dom': ^19.3.0
    typescript: ^5.9.3
    eslint: ^9.39.5
    rolldown: 1.3.2
    '@oxc-project/types': 0.158.0
    vite: ^8.3.8
    vitest: ^4.1.12
    '@vitest/coverage-v8': ^3.2.7
    '@vitest/browser': ^3.2.7
