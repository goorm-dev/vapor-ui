packages:
    - apps/*
    - packages/*
    - scripts/ts-api-extractor
    - scripts/icon-extractor

engineStrict: true

allowBuilds:
    '@parcel/watcher': true
    esbuild: true
    sharp: true
    unrs-resolver: true
    workerd: true

# Unified React 19 for entire monorepo
# Libraries (packages/*) maintain peerDependencies for React 17/18/19 compatibility
catalog:
    react: ^19.3.1
    react-dom: ^19.3.1
    '@types/react': ^19.3.0
    '@types/react-dom': ^19.3.0
    typescript: ^5.9.3
    eslint: ^9.39.5
    rolldown: 1.2.14
    '@oxc-project/types': 0.147.0
    vite: ^7.3.7
    vitest: ^3.2.7
    '@vitest/coverage-v8': ^3.2.7
    '@vitest/browser': ^3.2.7
