packages:
    - apps/*
    - packages/*
    - scripts/docs-extractor
    - scripts/docs-translator
    - scripts/icon-extractor
    - scripts/extract-composites

engineStrict: true

allowBuilds:
    '@parcel/watcher': true
    esbuild: true
    sharp: true
    unrs-resolver: true
    workerd: true

# Unified React 19 for entire monorepo
# Libraries (packages/*) maintain peerDependencies for React 17/18/19 compatibility
catalog:
    react: ^19.3.1
    react-dom: ^19.3.1
    '@types/react': ^19.3.0
    '@types/react-dom': ^19.3.0
    typescript: ^5.9.3
    eslint: ^9.39.5
    rolldown: 1.2.15
    '@oxc-project/types': 0.156.0
    vite: ^8.0.0
    vitest: ^4.1.12
    '@vitest/coverage-v8': ^3.2.7
    '@vitest/browser': ^3.2.7
